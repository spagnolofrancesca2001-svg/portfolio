<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Francesca Spagnolo - visual designer and art director working across fashion, beauty and food brands. Brand identity, campaigns and digital design.">
<meta property="og:title" content="Francesca Spagnolo">
<meta property="og:description" content="Francesca Spagnolo - visual designer and art director working across fashion, beauty and food brands. Brand identity, campaigns and digital design.">
<meta property="og:image" content="img/tomasa-hero.jpg">
<meta property="og:type" content="website">
<title>Francesca Spagnolo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #888888;
  --border: #e0e0e0;
  --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'DM Mono', monospace;
  --nav-h: 44px;
  --gap: 10px;
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-weight: 300;
  cursor: none;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--nav-h);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 20px; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.nav-logo { font-size: 14px; font-weight: 400; letter-spacing: 0.02em; color: var(--fg); text-decoration: none; }
.logo-short { display: none; }
.nav-center { display: flex; align-items: center; gap: 24px; }
.nav-link { font-size: 14px; font-weight: 300; letter-spacing: 0.05em; color: var(--muted); text-decoration: none; transition: color 0.15s; }
.nav-link:hover { color: var(--fg); }
.nav-right { display: flex; align-items: center; justify-content: flex-end; }
.nav-back { font-family: var(--mono); font-size: 11px; font-weight: 300; letter-spacing: 0.05em; color: var(--muted); text-decoration: none; transition: color 0.15s; }
.nav-back:hover { color: var(--fg); }
.back-label { }
@media (max-width: 800px) {
  .logo-full { display: none; }
  .logo-short { display: inline; }
  .back-label { display: none; }
  .nav-back {
    font-size: 20px;
    font-family: var(--font);
    padding: 8px 0 8px 16px;
    color: var(--fg);
  }
}

/* MAIN */
main { margin-top: var(--nav-h); }

/* HERO IMAGE */
.project-hero {
  width: 100%;
  height: calc(100vh - var(--nav-h));
  background: #f0f0f0;
  position: relative;
  overflow: hidden;
}
.hero-img-placeholder {
  width: 100%; height: 100%;
  /* Replace with: background-image: url('img/project-x.jpg'); background-size: cover; background-position: center; */
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
}

/* PROJECT INFO STRIP */
.info-strip {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-bottom: 1px solid var(--border);
}
.info-cell {
  padding: 20px var(--gap) 18px;
}
.info-label {
  font-family: var(--mono); font-size: 10px; font-weight: 300;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 6px;
}
.info-value {
  font-size: 13px; font-weight: 400; letter-spacing: 0.01em; color: var(--fg);
}

/* CONTENT */
.project-content {
  min-height: 60vh;
}

.project-body {
  padding: var(--gap);
  padding-bottom: calc(var(--gap) * 3);
}

.project-title-large {
  font-size: clamp(2rem, 5vw, 4.5rem);
  font-weight: 300; letter-spacing: -0.02em;
  line-height: 1.05; color: var(--fg);
  margin-bottom: 32px;
}

.project-description {
  font-size: 20px; font-weight: 300; line-height: 1.75;
  color: var(--fg); max-width: 640px;
  margin-bottom: 40px;
}
.project-description p + p { margin-top: 16px; }
.project-description a {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  transition: color 0.15s;
}
.project-description a:hover { color: var(--muted); }
@media (max-width: 800px) {
  .project-description { font-size: 15px; }
}

/* IMAGE GALLERY */
.project-images {
  display: grid;
  gap: var(--gap);
  margin-top: 40px;
  margin-bottom: 40px;
}

/* NAV PREV/NEXT */
.project-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.proj-nav-link {
  padding: 16px 20px;
  text-decoration: none; color: var(--fg);
  display: flex; align-items: center;
  gap: 12px;
  font-size: 20px;
  transition: color 0.15s;
}
.proj-nav-link:last-child { justify-content: flex-end; }
.proj-nav-link:last-child .proj-nav-title { text-align: right; }
.proj-nav-link:hover { color: var(--muted); }
.proj-nav-arrow { font-size: 20px; flex-shrink: 0; }
.proj-nav-title { font-size: 13px; font-weight: 400; color: var(--fg); }

/* GIF GRID */
.gif-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--gap);
}
.gif-grid-cell { aspect-ratio: 9/16; overflow: hidden; }
.gif-grid-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 800px) {
  .gif-grid { grid-template-columns: repeat(2, 1fr); }
  .gif-grid-cell:nth-child(3) { grid-column: 1 / -1; }
}

/* TRIO */
.trio {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--gap);
}
@media (max-width: 800px) {
  .trio-mobile-full { grid-template-columns: 1fr; }
}

/* DUO */
.duo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
@media (max-width: 800px) {
  .duo-mobile-full { grid-template-columns: 1fr; }
}

/* FRAMED VIDEO */
.framed-video { background: #ffffff; padding: 200px; overflow: hidden; }
@media (max-width: 800px) {
  .framed-video { padding: 0; }
}

/* CONTACT FOOTER */
.project-contact {
  display: flex; justify-content: center; align-items: center;
  padding: 16px 20px 24px;
  border-top: 1px solid var(--border);
  font-family: var(--mono); font-size: 11px; font-weight: 300;
  letter-spacing: 0.05em; color: var(--muted);
}
.project-contact a { color: var(--fg); text-decoration: none; transition: color 0.15s; }
.project-contact a:hover { color: var(--muted); }

/* STICKY TITLE BAR */
.project-sticky-bar {
  position: fixed;
  top: var(--nav-h);
  left: 0; right: 0;
  padding: 20px 24px 56px;
  background: linear-gradient(rgba(255,255,255,0.97) 28%, transparent);
  z-index: 50;
  pointer-events: none;
}
.psb-label {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.psb-title {
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.01em;
  color: var(--fg);
  line-height: 1.3;
}

/* CUSTOM CURSOR */
.cursor {
  width: 6px; height: 6px; background: var(--fg);
  border-radius: 50%; position: fixed; pointer-events: none;
  z-index: 9999; transform: translate(-50%, -50%);
  transition: width 0.2s, height 0.2s, background 0.2s;
}

/* DUO VIDEO */
.duo-video {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  padding: 40px 0;
  width: 100%;
}
.duo-video-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.duo-video video {
  max-height: calc(70vh - var(--nav-h));
  width: auto;
  max-width: 100%;
  object-fit: contain;
}
@media (max-width: 800px) {
  .duo-video { grid-template-columns: 1fr; }
}

/* RESPONSIVE */
@media (max-width: 800px) {
  .info-strip { grid-template-columns: 1fr 1fr; }
  body { cursor: auto; }
  .cursor { display: none; }
}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<nav>
  <a href="index.html" class="nav-logo">
    <span class="logo-full">Francesca Spagnolo</span>
    <span class="logo-short">FS</span>
  </a>
  <div class="nav-center">
    <a href="index.html" class="nav-link">Works</a>
    <a href="info.html" class="nav-link">About</a>
  </div>
  <div class="nav-right">
    <a href="index.html" class="nav-back">← <span class="back-label">Back</span></a>
  </div>
</nav>

<main>

  <div class="project-sticky-bar">
    <p class="psb-label"></p>
    <p class="psb-title"></p>
  </div>

  <!-- Hero -->
  <div class="project-hero">
    <div class="hero-img-placeholder">
      <!-- sostituisci con: <img src="img/progetto-x-hero.jpg" style="width:100%;height:100%;object-fit:cover;"> -->
      project image
    </div>
  </div>

  <!-- Content -->
  <div class="project-content">

    <div class="project-body">
      <div class="project-description" id="desc-1"></div>
      <div class="project-images" id="gallery-1"></div>
      <div class="project-description" id="desc-2"></div>
      <div class="project-images" id="gallery-2"></div>
      <div class="project-description" id="desc-3"></div>
    </div>
  </div>

  <!-- Prev / Next -->
  <div class="project-nav">
    <a class="proj-nav-link" id="proj-prev"><span class="proj-nav-arrow">←</span><span class="proj-nav-title"></span></a>
    <a class="proj-nav-link" id="proj-next"><span class="proj-nav-title"></span><span class="proj-nav-arrow">→</span></a>
  </div>

  <div class="project-contact">
    <a href="mailto:francescaspagnolo01@gmail.com">Let's talk</a>
  </div>

</main>

<script src="data.js"></script>
<script>
(function() {
  const id = parseInt(new URLSearchParams(location.search).get('id')) || 0;
  const idx = projects.findIndex(pr => pr.id === id);
  const i = idx >= 0 ? idx : 0;
  const p = projects[i];
  const n = projects.length;
  const prev = projects[(i - 1 + n) % n];
  const next = projects[(i + 1) % n];
  const alt = p.title.join(' ').replace(/"/g, '&quot;');

  document.title = `${p.title.join(' ')} — Francesca Spagnolo`;

  // Hero image
  const heroEl = document.querySelector('.hero-img-placeholder');
  if (p.images && p.images.hero) {
    // On mobile use the dedicated hero when available
    const heroSrc = (window.matchMedia('(max-width: 800px)').matches && p.images.heroMobile) || p.images.hero;
    heroEl.innerHTML = `<img src="${heroSrc}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${p.title.join(' ')}">`;
  }

  const isMobileView = window.matchMedia('(max-width: 800px)').matches;

  function renderItem(item) {
    // Mobile-only replacement: { src, mobile: [one or more images] }
    if (item && item.mobile && isMobileView) return item.mobile.map(renderItem).join('');
    if (item && item.src && !item.layout) return renderItem(item.src);
    if (typeof item === 'string') {
      return `<div style="overflow:hidden;">
        <img src="${item}" style="width:100%;display:block;" alt="${alt}">
      </div>`;
    } else if (item.layout === 'duo-video') {
      return `<div class="duo-video">
        ${item.srcs.map(src => `<div class="duo-video-cell"><video src="${src}" autoplay loop muted playsinline></video></div>`).join('')}
      </div>`;
    } else if (item.layout === 'framed') {
      return `<div style="background:#ffffff;padding:200px;overflow:hidden;">
        <img src="${item.src}" style="width:100%;display:block;" alt="${alt}">
      </div>`;
    } else if (item.layout === 'framed-video') {
      const speed = item.speed || 0.5;
      return `<div class="framed-video">
        <video src="${item.src}" style="width:100%;display:block;" autoplay loop muted playsinline data-speed="${speed}"></video>
      </div>`;
    } else if (item.layout === 'rotated') {
      const deg = item.deg || 180;
      return `<div style="overflow:hidden;">
        <img src="${item.src}" style="width:100%;display:block;transform:rotate(${deg}deg);" alt="${alt}">
      </div>`;
    } else if (item.layout === 'trio') {
      return `<div class="trio${item.mobileFull ? ' trio-mobile-full' : ''}">
        ${item.srcs.map(src => `<div style="aspect-ratio:3/4;overflow:hidden;">
          <img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${alt}">
        </div>`).join('')}
      </div>`;
    } else if (item.layout === 'text') {
      return `<p class="project-description" style="margin-top:0;">${item.content}</p>`;
    } else if (item.layout === 'gif-grid') {
      return `<div class="gif-grid">
        ${item.srcs.map(src => `<div class="gif-grid-cell"><img src="${src}" alt="${alt}"></div>`).join('')}
      </div>`;
    } else if (item.layout === 'duo') {
      return `<div class="duo${item.mobileFull ? ' duo-mobile-full' : ''}">
        ${item.srcs.map(src => `<div style="aspect-ratio:1/1;overflow:hidden;background:#ececec;">
          <img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${alt}">
        </div>`).join('')}
      </div>`;
    }
    return '';
  }

  // Description split
  const paras = p.description.split('\n\n').map(s => s.trim()).filter(Boolean);
  document.getElementById('desc-1').innerHTML = paras[0] ? `<p>${paras[0]}</p>` : '';
  document.getElementById('desc-2').innerHTML = paras[1] ? `<p>${paras[1]}</p>` : '';
  document.getElementById('desc-3').innerHTML = paras.slice(2).map(s => `<p>${s}</p>`).join('');

  // Gallery split: first item in gallery-1, rest in gallery-2
  const gallery = (p.images && p.images.gallery) || [];
  if (gallery.length > 0) document.getElementById('gallery-1').innerHTML = renderItem(gallery[0]);
  if (gallery.length > 1) document.getElementById('gallery-2').innerHTML = gallery.slice(1).map(renderItem).join('');

  document.querySelector('.psb-label').textContent = `${p.category} — ${p.year}`;
  document.querySelector('.psb-title').innerHTML = p.title.join('<br>');

  document.querySelectorAll('video[data-speed]').forEach(v => {
    v.playbackRate = parseFloat(v.dataset.speed);
  });

  document.querySelectorAll('[data-field]').forEach(el => {
    el.textContent = p[el.dataset.field] || '';
  });

  const prevEl = document.getElementById('proj-prev');
  prevEl.href = `project.html?id=${prev.id}`;
  prevEl.querySelector('.proj-nav-title').textContent = prev.title.join(' ');

  const nextEl = document.getElementById('proj-next');
  nextEl.href = `project.html?id=${next.id}`;
  nextEl.querySelector('.proj-nav-title').textContent = next.title.join(' ');
})();

const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});

</script>
</body>
</html>
